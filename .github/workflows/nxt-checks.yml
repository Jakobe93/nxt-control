# nxt checks — runs on every pull request (and on demand).
# Canonical copy: Jakobe93/nxt-md templates/nxt-checks.yml. Re-sync from there
# with tools/sync.py; do not edit this file in a resource repo.
name: nxt checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nxt-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # folders with a package.json that has a `build` script, space separated
  NXT_WEB_DIRS: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the docs check compares with the base branch

      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Lua syntax
        run: python3 .github/nxt/nxt_check.py lua

      # Only for repos with a perf recipe (.github/nxt-perf.lua); guide: tools/README-perf.md in nxt-md
      - name: Perf counts within the baseline
        if: always() && hashFiles('.github/nxt-perf.lua') != ''
        run: lua5.4 .github/nxt/perf.lua check

      - name: Contracts are up to date
        if: always()
        run: python3 .github/nxt/nxt_check.py contracts --check

      - name: Required files
        if: always()
        run: python3 .github/nxt/nxt_check.py required

      - name: Line endings kept
        if: always() && github.event_name == 'pull_request'
        run: python3 .github/nxt/nxt_check.py eol --base "origin/${{ github.base_ref }}"

      - name: Docs follow the change
        if: always() && github.event_name == 'pull_request'
        run: python3 .github/nxt/nxt_check.py docs --base "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v5
        if: always()
        with:
          node-version: 22
          package-manager-cache: false   # v5 would otherwise start caching on its own

      - name: Clean UI build
        if: always() && env.NXT_WEB_DIRS != ''
        run: |
          for dir in $NXT_WEB_DIRS; do
            echo "::group::build $dir"
            ( cd "$dir"
              rm -rf node_modules/.vite
              # pnpm only when the folder says so: "packageManager": "pnpm@<version>" in its
              # package.json. A pnpm-lock.yaml alone is not enough (forks inherit one from upstream).
              pm=$(node -p "((require('./package.json').packageManager)||'').split('@')[0]")
              if [ "$pm" = "pnpm" ]; then
                corepack enable
                pnpm install --frozen-lockfile
                pnpm run build
              else
                if [ -f package-lock.json ]; then
                  npm ci --no-audit --no-fund || npm ci --no-audit --no-fund --legacy-peer-deps
                else
                  npm install --no-audit --no-fund
                fi
                npm run build
              fi )
            echo "::endgroup::"
          done

      - name: Headless render
        if: always()
        run: |
          if ! grep -Eq "^\s*(ui_page|loadscreen)\b" fxmanifest.lua; then
            echo "no ui_page or loadscreen - nothing to render"; exit 0
          fi
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.0
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          node .github/nxt/render_check.cjs "$RUNNER_TEMP/nxt-render.png"

      - name: Keep the render
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nxt-render
          path: ${{ runner.temp }}/nxt-render.png
          if-no-files-found: ignore
          retention-days: 7
